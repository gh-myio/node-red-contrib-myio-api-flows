name: Build and Pack

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [16.x, 18.x, 20.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Install dependencies
      run: npm install --no-audit --no-fund

    - name: Run tests
      run: npm test

    - name: Pack package
      run: npm pack

    - name: Upload package artifact
      uses: actions/upload-artifact@v4
      with:
        name: node-red-contrib-myio-api-flows-${{ matrix.node-version }}
        path: '*.tgz'
        retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    # não roda no push do próprio commit de release (evita loop)
    if: >-
      (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') &&
      !startsWith(github.event.head_commit.message, 'chore(release)')

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0   # precisa das tags para decidir o bump

    - name: Use Node.js 18.x
      uses: actions/setup-node@v4
      with:
        node-version: 18.x

    - name: Install dependencies
      run: npm install --no-audit --no-fund

    # Cada merge no master gera uma release NOVA: se a tag da versão do
    # package.json já existe, auto-bumpa o patch e commita de volta — nunca
    # sobrescreve uma release/tag existente.
    - name: Resolve release version
      id: package
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        version=$(node -p "require('./package.json').version")
        if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
          npm version patch --no-git-tag-version
          version=$(node -p "require('./package.json').version")
          git commit -am "chore(release): v$version"
          git push origin HEAD:${{ github.ref_name }}
        fi
        git tag "v$version"
        git push origin "v$version"
        echo "version=$version" >> $GITHUB_OUTPUT
        echo "name=$(node -p "require('./package.json').name")" >> $GITHUB_OUTPUT

    - name: Pack package
      run: npm pack

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ steps.package.outputs.version }}
        name: Release v${{ steps.package.outputs.version }}
        files: ./${{ steps.package.outputs.name }}-${{ steps.package.outputs.version }}.tgz
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
