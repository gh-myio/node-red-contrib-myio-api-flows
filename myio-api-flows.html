<!-- ===================================================================== -->
<!-- Config node: myio-pg (conexão Postgres da central)                     -->
<!-- ===================================================================== -->
<script type="text/javascript">
  RED.nodes.registerType('myio-pg', {
    category: 'config',
    defaults: {
      name:     { value: '' },
      host:     { value: '127.0.0.1', required: true },
      port:     { value: 5432, required: true, validate: RED.validators.number() },
      database: { value: 'hubot', required: true },
      user:     { value: 'hubot' },
      max:      { value: 10, validate: RED.validators.number() },
    },
    credentials: {
      password: { type: 'password' },
    },
    label: function () {
      return this.name || (this.user + '@' + this.host + ':' + this.port + '/' + this.database);
    },
  });
</script>

<script type="text/html" data-template-name="myio-pg">
  <div class="form-row">
    <label for="node-config-input-name"><i class="fa fa-tag"></i> Nome</label>
    <input type="text" id="node-config-input-name" placeholder="ex.: hubot (central)">
  </div>
  <div class="form-row">
    <label for="node-config-input-host"><i class="fa fa-server"></i> Host</label>
    <input type="text" id="node-config-input-host" placeholder="127.0.0.1">
  </div>
  <div class="form-row">
    <label for="node-config-input-port"><i class="fa fa-plug"></i> Porta</label>
    <input type="text" id="node-config-input-port" placeholder="5432" style="width:120px">
  </div>
  <div class="form-row">
    <label for="node-config-input-database"><i class="fa fa-database"></i> Banco</label>
    <input type="text" id="node-config-input-database" placeholder="hubot">
  </div>
  <div class="form-row">
    <label for="node-config-input-user"><i class="fa fa-user"></i> Usuário</label>
    <input type="text" id="node-config-input-user" placeholder="hubot">
  </div>
  <div class="form-row">
    <label for="node-config-input-password"><i class="fa fa-lock"></i> Senha</label>
    <input type="password" id="node-config-input-password" placeholder="(vazio p/ auth trust/peer local)">
  </div>
  <div class="form-row">
    <label for="node-config-input-max"><i class="fa fa-layer-group"></i> Pool máx</label>
    <input type="text" id="node-config-input-max" placeholder="10" style="width:120px">
  </div>
</script>

<!-- ===================================================================== -->
<!-- Node principal: myio-api-flows                                         -->
<!-- ===================================================================== -->
<script type="text/javascript">
  RED.nodes.registerType('myio-api-flows', {
    category: 'MYIO',
    color: '#8ac',
    defaults: {
      name:     { value: '' },
      pg:       { value: '', type: 'myio-pg', required: true },
      basePath: { value: '/api', required: true },
      ep_getMqttSyncStatus: { value: true },
      ep_getState:          { value: true },
      ep_clearAllData:      { value: true },
      ep_provision:         { value: true },
      ep_setMqttSyncStatus: { value: true },
      ep_telemetryEnergy:      { value: true },
      ep_telemetryPulses:      { value: true },
      ep_telemetryActuator:    { value: true },
      ep_telemetryTemperature: { value: true },
      ep_telemetryRawEnergy:   { value: false },
      ep_telemetryConsumption: { value: false },
      ep_logsServices: { value: true },
      ep_logs:         { value: true },
      logsUnits:      { value: '' },
      journalctlPath: { value: '' },
      centralUuid: { value: '' },
      gcdrUrl:     { value: '' },
    },
    inputs: 0,
    outputs: 0,
    icon: 'font-awesome/fa-random',
    label: function () {
      return this.name || ('API flows ' + (this.basePath || '/api'));
    },
    paletteLabel: 'myio api flows',
  });
</script>

<script type="text/html" data-template-name="myio-api-flows">
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Nome</label>
    <input type="text" id="node-input-name" placeholder="API flows">
  </div>
  <div class="form-row">
    <label for="node-input-pg"><i class="fa fa-database"></i> Postgres</label>
    <input type="text" id="node-input-pg">
  </div>
  <div class="form-row">
    <label for="node-input-basePath"><i class="fa fa-link"></i> Base path</label>
    <input type="text" id="node-input-basePath" placeholder="/api">
  </div>
  <div class="form-row">
    <label for="node-input-centralUuid"><i class="fa fa-fingerprint"></i> UUID central</label>
    <input type="text" id="node-input-centralUuid" placeholder="(vazio = ler da tabela environment)">
  </div>
  <div class="form-row">
    <label for="node-input-gcdrUrl"><i class="fa fa-cloud"></i> GCDR URL</label>
    <input type="text" id="node-input-gcdrUrl" placeholder="https://gcdr-api.a.myio-bas.com/api/v1">
  </div>
  <div class="form-tips">Auth <code>X-API-Key</code>: as keys vivem na tabela
  <code>environment</code> do banco (<code>CENTRAL_API_KEY</code> = completa;
  <code>CENTRAL_INITIAL_API_KEY</code> = bootstrap via GCDR, só
  <code>/state</code> e <code>/provision</code> restrito a
  <code>environment{}</code>). Sem key cadastrada = rotas abertas.</div>
  <hr>
  <div class="form-row"><b>Endpoints</b></div>
  <div class="form-row">
    <label style="width:auto"><input type="checkbox" id="node-input-ep_getMqttSyncStatus" style="width:auto;vertical-align:top"> <code>GET  {base}/mqttSyncStatus</code></label>
  </div>
  <div class="form-row">
    <label style="width:auto"><input type="checkbox" id="node-input-ep_getState" style="width:auto;vertical-align:top"> <code>GET  {base}/state</code></label>
  </div>
  <div class="form-row">
    <label style="width:auto"><input type="checkbox" id="node-input-ep_clearAllData" style="width:auto;vertical-align:top"> <code>POST {base}/clearAllData</code> ⚠️ destrutivo</label>
  </div>
  <div class="form-row">
    <label style="width:auto"><input type="checkbox" id="node-input-ep_provision" style="width:auto;vertical-align:top"> <code>POST {base}/provision</code></label>
  </div>
  <div class="form-row">
    <label style="width:auto"><input type="checkbox" id="node-input-ep_setMqttSyncStatus" style="width:auto;vertical-align:top"> <code>POST {base}/setMqttSyncStatus</code></label>
  </div>
  <div class="form-row"><b>Telemetry (RFC-0001)</b></div>
  <div class="form-row">
    <label style="width:auto"><input type="checkbox" id="node-input-ep_telemetryEnergy" style="width:auto;vertical-align:top"> <code>GET  {base}/telemetry/energy</code></label>
  </div>
  <div class="form-row">
    <label style="width:auto"><input type="checkbox" id="node-input-ep_telemetryPulses" style="width:auto;vertical-align:top"> <code>GET  {base}/telemetry/pulses</code></label>
  </div>
  <div class="form-row">
    <label style="width:auto"><input type="checkbox" id="node-input-ep_telemetryActuator" style="width:auto;vertical-align:top"> <code>GET  {base}/telemetry/actuator</code></label>
  </div>
  <div class="form-row">
    <label style="width:auto"><input type="checkbox" id="node-input-ep_telemetryTemperature" style="width:auto;vertical-align:top"> <code>GET  {base}/telemetry/temperature</code></label>
  </div>
  <div class="form-row">
    <label style="width:auto"><input type="checkbox" id="node-input-ep_telemetryRawEnergy" style="width:auto;vertical-align:top"> <code>GET  {base}/telemetry/raw-energy</code> (default off)</label>
  </div>
  <div class="form-row">
    <label style="width:auto"><input type="checkbox" id="node-input-ep_telemetryConsumption" style="width:auto;vertical-align:top"> <code>GET  {base}/telemetry/consumption</code> (default off)</label>
  </div>
  <div class="form-row"><b>Logs (RFC-0002)</b></div>
  <div class="form-row">
    <label style="width:auto"><input type="checkbox" id="node-input-ep_logsServices" style="width:auto;vertical-align:top"> <code>GET  {base}/logs/services</code></label>
  </div>
  <div class="form-row">
    <label style="width:auto"><input type="checkbox" id="node-input-ep_logs" style="width:auto;vertical-align:top"> <code>GET  {base}/logs</code></label>
  </div>
  <div class="form-row">
    <label for="node-input-logsUnits"><i class="fa fa-list"></i> Log units</label>
    <input type="text" id="node-input-logsUnits" placeholder="myio.service,myio-api.service">
  </div>
  <div class="form-row">
    <label for="node-input-journalctlPath"><i class="fa fa-terminal"></i> journalctl</label>
    <input type="text" id="node-input-journalctlPath" placeholder="journalctl (PATH)">
  </div>
  <div class="form-tips">Allowlist de units cujo journal o <code>GET /logs</code>
  pode ler (separadas por vírgula; vazio = default). O serviço do Node-RED
  precisa de permissão de leitura do journal dessas units (grupo
  <code>systemd-journal</code> ou equivalente).</div>
</script>

<script type="text/html" data-help-name="myio-api-flows">
  <p>Encapsula o <b>flow API</b> das centrais MYIO num único node: sobe as rotas
  HTTP (no servidor do Node-RED) e executa <code>validate → SQL → format</code>
  contra o Postgres da central (funções do kit <code>mqtt-sync</code>/state-api).</p>

  <h3>Rotas (sob o <i>base path</i>, default <code>/api</code>)</h3>
  <ul>
    <li><code>GET  /api/mqttSyncStatus</code> — <code>get_mqtt_sync_status()</code></li>
    <li><code>GET  /api/state</code> — snapshot ambients/slaves/channels/rfir/rels</li>
    <li><code>POST /api/clearAllData</code> — <code>clear_all_data_central()</code> (⚠️ apaga cadastro)</li>
    <li><code>POST /api/provision</code> — <code>provision_central($1::jsonb)</code> (exige <code>devices[]</code>)
        ou upsert de <code>environment{}</code> (key→value na tabela environment)</li>
    <li><code>POST /api/setMqttSyncStatus</code> — <code>set_mqtt_sync_status($1::jsonb)</code></li>
  </ul>

  <h3>Telemetry (RFC-0001)</h3>
  <p>Rotas <code>GET</code> read-only sobre a telemetria local
  (<code>?slave_id=&amp;from=&amp;to=&amp;limit=&amp;order=</code> — <code>slave_id</code>
  e <code>from</code> obrigatórios; <code>limit</code> máx. 5000):</p>
  <ul>
    <li><code>/telemetry/energy</code> — <code>consumption_realtime</code></li>
    <li><code>/telemetry/pulses</code> — <code>channel_pulse_log</code> (+<code>channel</code> opcional)</li>
    <li><code>/telemetry/actuator</code> — <code>logs</code> (+<code>channel</code> opcional)</li>
    <li><code>/telemetry/temperature</code> — <code>temperature_history</code></li>
    <li><code>/telemetry/raw-energy</code> — <code>raw_energy</code> (default off)</li>
    <li><code>/telemetry/consumption</code> — <code>consumption</code>
        (<code>slave_id</code> ou <code>ambient_id</code>; default off)</li>
  </ul>
  <p>Exigem a <code>CENTRAL_API_KEY</code> (a initial key não vale).</p>

  <h3>Logs (RFC-0002)</h3>
  <p>Journal do systemd das units da <b>allowlist</b> (default
  <code>myio.service,myio-api.service</code>), via <code>journalctl</code>
  limitado (sem shell, sem <code>--follow</code>):</p>
  <ul>
    <li><code>GET /logs/services</code> — allowlist + estado das units</li>
    <li><code>GET /logs?service=&amp;since=&amp;until=&amp;priority=&amp;grep=&amp;limit=&amp;order=</code>
        — <code>service</code> (da allowlist) e <code>since</code> obrigatórios;
        <code>limit</code> máx. 5000</li>
  </ul>
  <p>Também exigem a <code>CENTRAL_API_KEY</code>. Unit sem permissão de leitura
  aparece como <code>active: "unknown"</code> no <code>/logs/services</code>.</p>

  <h3>Auth — X-API-Key (ED-1096 / RFC-0056)</h3>
  <p>As keys vivem na tabela <code>environment</code> do banco e são lidas a cada
  request (rotação por <code>UPDATE</code>, sem redeploy):</p>
  <ul>
    <li><code>CENTRAL_API_KEY</code> — key completa: vale nas 5 rotas.</li>
    <li><code>CENTRAL_INITIAL_API_KEY</code> — obtida do GCDR no deploy
        (pre-key hardcoded + uuid da central, TOFU); só autoriza
        <code>GET /state</code> e <code>POST /provision</code> restrito a
        <code>environment{}</code> — é por ela que o pre-setup grava a
        <code>CENTRAL_API_KEY</code>.</li>
  </ul>
  <p>Sem key cadastrada na tabela → rotas abertas (retrocompatível).
  Key ausente/errada → <code>401</code>; <code>devices[]</code> com a initial
  key → <code>403</code>.</p>

  <p>Requer um config node <b>Postgres (myio-pg)</b>. Substitui a aba API inteira
  (http-in + function + postgresql + http-response).</p>
</script>
